name: Validate source and unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify required files
        run: |
          test -f LICENSE
          test -f README.md
          test -f pom.xml
          test -f src/main/resources/atlassian-plugin.xml
      - name: Compile and test
        run: mvn --batch-mode --no-transfer-progress test
