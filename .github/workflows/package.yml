name: Build installable plugin candidate
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate descriptor
        run: python3 scripts/validate_scaffold.py
      - name: Run offline tests
        run: bash scripts/test_core.sh
      - name: Build Jira plugin
        run: mvn --batch-mode --no-transfer-progress --fail-at-end verify
      - name: Upload JAR candidate
        uses: actions/upload-artifact@v4
        with:
          name: openpr-jira-plugin-candidate
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
